[project]
name = "mato-loop-backend"
version = "0.1.0"
description = "MatoLoop FastAPI backend"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matoloop-version",
    "aiohttp>=3.12.0",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.13.0",
    "cryptography>=45.0.0",
    "curl-cffi==0.17.0",
    "cronsim>=2.7,<3.0",
    "detect-secrets>=1.5.0,<2.0.0",
    "defusedxml>=0.7.1",
    "ddgs>=9.14.4,<10.0.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "icalendar>=6.3.0,<7.0.0",
    "jsonschema>=4.25.0,<5.0.0",
    "markdown-it-py>=4.0,<5.0",
    "markdownify>=1.2.0",
    "mcp>=1.14.0,<2.0.0",
    "openpyxl>=3.1.5",
    "pillow>=11.3.0",
    "pypdf>=5.8.0",
    "pywebpush==2.4.0",
    "pgvector>=0.5.0,<0.6.0",
    "pydantic-settings>=2.10.0",
    "pyyaml>=6.0.3,<7",
    "python-multipart>=0.0.20",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "python-telegram-bot>=22.8,<23.0",
    "pwdlib[argon2]>=0.2.1",
    "sqlalchemy[asyncio]>=2.0.41",
    "uvicorn[standard]>=0.35.0",
    "yarl>=1.20.0",
    "zxing-cpp>=3.1.1,<4.0.0",
    "presidio-analyzer>=2.2.0",
    "tzdata>=2026.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
matoloop-version = { path = "../../libs/python/version", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mato_loop_backend"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
]
docs = [
    "mkdocs-material==9.7.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mato_loop_backend"]
known-third-party = ["alembic"]

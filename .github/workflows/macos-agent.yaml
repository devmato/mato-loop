name: macOS Agent

on:
  pull_request:
    paths:
      - 'apps/matoloop-agent/**'
      - 'libs/python/version/**'
      - 'scripts/install-matoloop-agent.sh'
      - 'scripts/matoloop-agent-installer.py'
      - '.github/workflows/macos-agent.yaml'
  push:
    branches: [develop]
    paths:
      - 'apps/matoloop-agent/**'
      - 'libs/python/version/**'
      - 'scripts/install-matoloop-agent.sh'
      - 'scripts/matoloop-agent-installer.py'
      - '.github/workflows/macos-agent.yaml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  macos-agent:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          architecture: arm64
      - name: Verify native macOS runtime
        working-directory: apps/matoloop-agent
        run: |
          test "$(uname -m)" = arm64
          test "$(id -u)" -ne 0
          python -c 'import platform; assert platform.machine() == "arm64"'
          python -m pip install uv==0.10.9
          uv sync --frozen
          mkdir -p "$RUNNER_TEMP/macos-agent"
          export TMPDIR="$(cd "$RUNNER_TEMP/macos-agent" && pwd -P)"
          uv run --no-sync python - <<'PY'
          import os
          import runpy
          from pathlib import Path

          installer = runpy.run_path("../../scripts/matoloop-agent-installer.py")
          installer["install_macos_ripgrep"]({"root": Path(os.environ["TMPDIR"])})
          PY
          export PATH="$TMPDIR/tools/bin:$PATH"
          uv run --no-sync python -m unittest discover -s tests -p test_posix_macos.py -v
          uv run --no-sync python -m unittest discover -s tests -p test_macos_browser.py -v
          PYTHONPATH=tests uv run --no-sync python -m unittest -v \
            test_filesystem.FilesystemTests.test_full_file_lifecycle_uses_absolute_paths \
            test_filesystem.FilesystemTests.test_compare_and_swap_write_restores_concurrent_edit \
            test_filesystem.FilesystemTests.test_every_directory_component_is_opened_without_following_links \
            test_process_execution.ProcessExecutionTests.test_shebang_script_finds_sibling_helper_with_original_arguments \
            test_process_execution.ProcessExecutionTests.test_isolated_process_receives_only_explicit_environment_additions \
            test_process_execution.ProcessExecutionTests.test_timeout_default_local_cap_and_bounded_failure_output \
            test_process_execution.ProcessExecutionTests.test_cwd_swaps_and_executable_validation_do_not_follow_symlinks \
            test_terminal.TerminalTests.test_interactive_shell_preserves_state_bytes_size_and_ctrl_c
          export MATOLOOP_BROWSER_DATA_DIR="$TMPDIR/data"
          export MATOLOOP_BROWSER_ROOT="$TMPDIR/probe"
          export MATOLOOP_BROWSER_INSTALLATION="$TMPDIR/browser"
          mkdir -p "$MATOLOOP_BROWSER_DATA_DIR" "$MATOLOOP_BROWSER_ROOT"
          uv run --no-sync python -m matoloop_agent browser-install

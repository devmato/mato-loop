name: CI

on:
  push:
    branches: ["**"]
    tags: ["[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')) && 'publication' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Restore backend package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/uv
          key: uv-backend-${{ runner.os }}-py312-0.10.9-${{ hashFiles('apps/backend/uv.lock') }}
          restore-keys: uv-backend-${{ runner.os }}-py312-0.10.9-
      - name: Install backend dependencies
        working-directory: apps/backend
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git poppler-utils ripgrep
          python -m pip install uv==0.10.9
          uv sync --frozen --group docs
      - name: Check backend
        working-directory: apps/backend
        run: |
          uv run --no-sync mkdocs build --strict --config-file ../../mkdocs.yml --site-dir /tmp/mato-loop-docs
          uv run --no-sync python -m compileall src/mato_loop_backend
          uv run --no-sync ruff check src tests ../../libs/python/version/src
      - name: Test backend
        working-directory: apps/backend
        run: uv run --no-sync pytest --durations=20

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Restore frontend package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/yarn-cache
          key: yarn-frontend-${{ runner.os }}-node22-4.10.3-${{ hashFiles('apps/frontend/yarn.lock') }}
          restore-keys: yarn-frontend-${{ runner.os }}-node22-4.10.3-
      - name: Install frontend dependencies
        working-directory: apps/frontend
        env:
          YARN_CACHE_FOLDER: ${{ runner.temp }}/yarn-cache
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          yarn install --immutable
      - name: Check frontend
        working-directory: apps/frontend
        run: |
          yarn lint
          yarn build
      - name: Test frontend
        working-directory: apps/frontend
        run: yarn test

  matoloop-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Restore MatoLoop Agent package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/uv
          key: uv-agent-${{ runner.os }}-py313-0.10.9-${{ hashFiles('apps/matoloop-agent/uv.lock') }}
          restore-keys: uv-agent-${{ runner.os }}-py313-0.10.9-
      - name: Install MatoLoop Agent dependencies
        working-directory: apps/matoloop-agent
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openscad ripgrep xauth xvfb
          python -m pip install uv==0.10.9
          uv sync --frozen
      - name: Check MatoLoop Agent
        working-directory: apps/matoloop-agent
        run: |
          sh -n ../../scripts/install-matoloop-agent.sh
          uv run --no-sync python -m compileall src tests ../../scripts/matoloop-agent-installer.py
          uv run --no-sync ruff check src tests ../../scripts/matoloop-agent-installer.py
          uv run --no-sync ruff format --check src tests ../../scripts/matoloop-agent-installer.py
      - name: Test MatoLoop Agent
        working-directory: apps/matoloop-agent
        run: sudo env "PATH=$PATH" .venv/bin/python -m unittest discover -s tests -v --durations 20

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:0.8.5-pg17-bookworm
        env:
          POSTGRES_DB: matoloop
          POSTGRES_USER: matoloop
          POSTGRES_PASSWORD: matoloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matoloop -d matoloop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MATO_LOOP_DATABASE_URL: postgresql+asyncpg://matoloop:matoloop@localhost:5432/matoloop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Restore backend package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/uv
          key: uv-backend-${{ runner.os }}-py312-0.10.9-${{ hashFiles('apps/backend/uv.lock') }}
          restore-keys: uv-backend-${{ runner.os }}-py312-0.10.9-
      - name: Install migration dependencies
        working-directory: apps/backend
        run: |
          python -m pip install uv==0.10.9
          uv sync --frozen --no-dev
      - name: Verify migration round trip
        working-directory: apps/backend
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check
          uv run --no-sync alembic downgrade base
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Syntax-check CI scripts
        run: |
          bash -n scripts/release.sh
          bash -n scripts/ci/publish-docker-image.sh
          python3 -m py_compile scripts/check-version.py scripts/ci/create-release.py scripts/ci/check-develop-revision.py
      - name: Test CI helpers
        run: |
          bash scripts/ci/publish-docker-image.sh --self-test
          python3 scripts/ci/check-develop-revision.py --self-test
          python3 scripts/ci/create-release.py --self-test
          python3 scripts/ci/create-release.py --check-notes HEAD
      - name: Check versions and release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/check-version.py "${GITHUB_REF#refs/tags/}"
            [[ "$(git cat-file -t "$GITHUB_REF")" == tag ]] || { printf 'Release tag must be annotated.\n' >&2; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || { printf 'Release tag must point to a commit on main.\n' >&2; exit 1; }
          else
            python3 scripts/check-version.py
          fi
  image-mato-loop:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: [backend, frontend, matoloop-agent, migrations, version]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build production image
        run: bash scripts/ci/publish-docker-image.sh build mato-loop . apps/backend/Dockerfile

  image-matoloop-agent:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: [backend, frontend, matoloop-agent, migrations, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build production image
        run: bash scripts/ci/publish-docker-image.sh build matoloop-agent . apps/matoloop-agent/Dockerfile

  publish-images:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/'))
    needs: [backend, frontend, matoloop-agent, migrations, version]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CONTAINER_REGISTRY: ghcr.io
      CONTAINER_IMAGE_NAMESPACE: ${{ github.repository }}
      CONTAINER_USERNAME: ${{ github.actor }}
      CONTAINER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check develop revision before building
        id: build_freshness
        if: github.ref == 'refs/heads/develop'
        env:
          CI_API_URL: ${{ github.api_url }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/check-develop-revision.py
      - name: Build both images before publication
        if: github.ref != 'refs/heads/develop' || steps.build_freshness.outputs.current == 'true'
        env:
          KEEP_LOCAL_IMAGE: "1"
        run: |
          bash scripts/ci/publish-docker-image.sh build mato-loop . apps/backend/Dockerfile
          bash scripts/ci/publish-docker-image.sh build matoloop-agent . apps/matoloop-agent/Dockerfile
      - name: Check current develop revision
        id: freshness
        if: github.ref == 'refs/heads/develop' && steps.build_freshness.outputs.current == 'true'
        env:
          CI_API_URL: ${{ github.api_url }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/check-develop-revision.py
      - name: Publish both images
        if: github.ref != 'refs/heads/develop' || steps.freshness.outputs.current == 'true'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            mode=release
            tag="${GITHUB_REF#refs/tags/}"
          else
            mode=develop
            tag=
          fi
          bash scripts/ci/publish-docker-image.sh "$mode" mato-loop . apps/backend/Dockerfile "$tag"
          bash scripts/ci/publish-docker-image.sh "$mode" matoloop-agent . apps/matoloop-agent/Dockerfile "$tag"
      - name: Remove local publication images
        if: always()
        run: docker image rm --force "mato-loop:ci-$CI_RUN_ID" "matoloop-agent:ci-$CI_RUN_ID" >/dev/null 2>&1 || true

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [publish-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create GitHub release
        env:
          CI_API_URL: ${{ github.api_url }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/create-release.py "${GITHUB_REF#refs/tags/}" "$GITHUB_SHA"
